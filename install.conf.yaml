- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.tmux.conf: tmux.conf
    ~/.vim: vim
    ~/.config/nvim: nvim
    ~/.ignore: ignore
    ~/.oh-my-zsh/custom/themes: oh-my-zsh/custom/themes/
    # ~/.zshrc: zshrc
    ~/.zshrc: zshrcv2.zsh
    ~/bin/:
      glob: true
      path: bin/*

- shell:
  - [git submodule update --init --recursive, Installing submodules]
